name: Carry Weight — development checks

on:
  pull_request:
    paths:
      - "Carry_Weight/**"
      - "scripts/package_release.py"
      - ".github/mod-descriptions.json"
      - ".github/workflows/carry-weight-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify M1 Arc manifest and REDscript consumer
        run: python3 Carry_Weight/tools/validate_carry_weight.py
      - name: Check standalone game-root package
        run: |
          python3 scripts/package_release.py --mod Carry_Weight --tag 0.1.0-dev.1 --output dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive=next(Path("dist").glob("*.zip"))
          with ZipFile(archive) as src:
              names=set(src.namelist())
              expected={
                "r6/scripts/M1ArcCarryWeight/M1ArcCarryWeight.reds",
                "red4ext/plugins/m1arc/mods/m1nsook.weight/mod.json",
                "red4ext/plugins/m1arc/mods/m1nsook.weight/settings.json",
                "red4ext/plugins/m1arc/mods/m1nsook.weight/language/en_US.json",
                "red4ext/plugins/m1arc/mods/m1nsook.weight/language/en_US.json.example",
              }
              assert names==expected, (names,expected)
              assert not any("/m1arc.dll" in x for x in names), "M1 Arc is a separate dependency"
          print("PASS: single game-root mod package with exactly five files")
          PY
      - name: Prepare direct-to-game development artifact
        run: |
          mkdir -p game-root
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive=next(Path("dist").glob("*.zip"))
          with ZipFile(archive) as src:
              src.extractall("game-root")
          assert Path("game-root/red4ext/plugins/m1arc/mods/m1nsook.weight/mod.json").is_file()
          assert Path("game-root/r6/scripts/M1ArcCarryWeight/M1ArcCarryWeight.reds").is_file()
          print("One ZIP download, game-root folders at archive top level")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: carry-weight-m1arc-game-root
          path: |
            game-root/red4ext/
            game-root/r6/
          if-no-files-found: error
