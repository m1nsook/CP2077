name: UndiscoverMe - development checks

on:
  pull_request:
    paths:
      - "UndiscoverMe/**"
      - ".github/workflows/undiscoverme-check.yml"
      - "Daemon/tools/check_redscript_cli.ps1"
      - "scripts/package_release.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Pin dependency declarations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory ".ci/m1arc-api" -Force | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/m1nsook/m1arc/8bd94c58869751f89323f5b7c47dd400c57f2bcb/r6/scripts/m1arc/M1Arc.reds" -OutFile ".ci/m1arc-api/M1Arc.reds"
      - name: Parse REDscript (semantic compilation when game bundle configured)
        shell: pwsh
        env:
          REDSCRIPT_GAME_BUNDLE_URL: ${{ secrets.REDSCRIPT_GAME_BUNDLE_URL }}
          REDSCRIPT_GAME_BUNDLE_SHA256: ${{ secrets.REDSCRIPT_GAME_BUNDLE_SHA256 }}
        run: |
          ./Daemon/tools/check_redscript_cli.ps1 -SourceRoots @("UndiscoverMe/r6/scripts", ".ci/m1arc-api")
          if ($LASTEXITCODE -ne 0) { throw "REDscript checks failed" }

  package:
    needs: parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native contracts
        run: |
          python3 UndiscoverMe/tools/validate_catalog.py
          python3 UndiscoverMe/tools/validate_quest_ids.py
          python3 UndiscoverMe/tools/validate_quest_links.py
          python3 UndiscoverMe/tools/validate_native_catalog.py
          python3 UndiscoverMe/tools/validate_undiscoverme_filters.py
      - name: Package game-root ZIP
        run: |
          python3 scripts/package_release.py --mod UndiscoverMe --tag 1.1.0-dev.1 --output dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path("dist").glob("*.zip"))) as z:
              names = z.namelist()
              assert names and all(n.startswith(("r6/", "red4ext/")) for n in names), names
              assert not any("cyber_engine_tweaks" in n or n.endswith(".lua") or n.endswith("m1arc.dll") for n in names)
              assert "red4ext/plugins/m1arc/mods/m1nsook.undiscoverme/mod.json" in names
              z.extractall("game-root")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: undiscoverme-game-root-dev
          path: game-root/
          if-no-files-found: error
