name: Release a mod

# Runs only when manually started. Never triggered by a push, tag, or PR.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod to release
        required: true
        type: choice
        options:
          - No_Tracking_Please
          - UndiscoverMe
          - UndiscoverMe_Teleporter
          - UndiscoverMe_Polish
          - UndiscoverMe_Korean
          - UndiscoverMe_Translation_Sources
      version:
        description: "Version (1.0.0 or v1.0.0; optional -dev.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.mod }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.mod }} ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package selected mod
        env:
          MOD: ${{ inputs.mod }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/package_release.py --mod "$MOD" --tag "$VERSION" --output dist

      - name: Publish standalone release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(cat dist/RELEASE_TAG.txt)"
          title="$(cat dist/RELEASE_TITLE.txt)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists already. Choose a new version." >&2
            exit 1
          fi
          extra=()
          if [[ "$tag" == *-v*-* ]]; then extra+=(--prerelease); fi
          gh release create "$tag" dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file dist/RELEASE_NOTES.md \
            "${extra[@]}"
