name: Kineticle - development checks
on:
  pull_request:
    paths:
      - 'Kineticle/**'
      - '.github/workflows/kineticle-check.yml'
      - 'Daemon/tools/check_redscript_cli.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 native DLL
        shell: pwsh
        run: |
          cmake -S Kineticle/Native -B build/kineticle -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Build native probe and tests
        shell: pwsh
        run: |
          cmake --build build/kineticle --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native build failed" }
          ctest --test-dir build/kineticle -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }
      - name: Parse optional M1 Arc controller
        shell: pwsh
        run: |
          ./Daemon/tools/check_redscript_cli.ps1 -SourceRoots @("Kineticle/Native/Controllers/M1Arc/r6/scripts")
          if ($LASTEXITCODE -ne 0) { throw "Controller parse failed" }
      - name: Package native Core and optional controller separately
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "build/package/red4ext/plugins/Kineticle"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "build/kineticle/Release/Kineticle.dll" "$dst/Kineticle.dll"
          $sdkLicense = Get-ChildItem "build/kineticle/_deps/red4ext_sdk-src" -File | Where-Object Name -Match '^LICENSE(\..*)?$' | Select-Object -First 1
          if (!$sdkLicense) { throw "SDK license missing" }
          Copy-Item $sdkLicense.FullName "$dst/RED4ext-SDK-LICENSE.txt"
          Copy-Item "build/kineticle/_deps/nlohmann_json-src/LICENSE.MIT" "$dst/nlohmann-json-LICENSE.txt"
          @'
          import json, hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          core = Path("build/package")
          ctrl = Path("Kineticle/Native/Controllers/M1Arc")
          m = json.loads((ctrl/"red4ext/plugins/m1arc/mods/m1nsook.kineticle/mod.json").read_text(encoding="utf-8"))
          assert m["format"] == 1 and m["id"] == "m1nsook.kineticle"
          assert m["version"] == "0.1.0" and m["requires"]["m1arc"] == "1.0.1"
          assert (core/"red4ext/plugins/Kineticle/Kineticle.dll").is_file()
          assert not list(core.rglob("*.reds"))
          for name, src in [("Core",core),("Controller-M1Arc",ctrl)]:
              with ZipFile(dist/f"Kineticle-{name}-0.1.0-dev.6-native-probe.2.zip","w",ZIP_DEFLATED) as z:
                  for p in sorted(src.rglob("*")):
                      if p.is_file():
                          assert p.relative_to(src).parts[0] in ("red4ext","r6")
                          z.write(p,p.relative_to(src).as_posix())
          (dist/"SHA256SUMS.txt").write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in sorted(dist.glob("*.zip"))))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: kineticle-0.1.0-dev.6-native-probe.2
          path: dist/
          if-no-files-found: error
