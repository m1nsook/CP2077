name: Auto-label issues and pull requests

# No builds, no checkout, no third-party labeler and no timer.
on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Add readable labels
    # Fork PRs have read-only credentials; do not fail on them.
    if: github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const item = pr || context.payload.issue;
            const number = item.number;
            const title = item.title || '';
            const desired = new Map();
            const add = (name, color, description) => desired.set(name, {color, description});

            // Title prefixes (feat:, fix:, docs:, etc.) or [Bug]/[Feature].
            const typeMatch = title.match(/^(feat|feature|fix|bug|docs|ci|chore|refactor|test|perf)(?:\([^)]+\))?[!:]|^\[(bug|feature|documentation)\]/i);
            if (typeMatch) {
              const kind = (typeMatch[1] || typeMatch[2]).toLowerCase();
              const types = {
                feat:['type: feature','1d76db'], feature:['type: feature','1d76db'],
                fix:['type: bug fix','d73a4a'], bug:['type: bug fix','d73a4a'],
                docs:['type: docs','0075ca'], documentation:['type: docs','0075ca'],
                ci:['type: maintenance','ededed'], chore:['type: maintenance','ededed'],
                refactor:['type: maintenance','ededed'], test:['type: maintenance','ededed'],
                perf:['type: performance','d4c5f9']
              };
              const [name, color] = types[kind];
              add(name, color, 'Identified from issue or PR title');
            }

            const files = pr
              ? (await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: number, per_page: 100
                })).map(f => f.filename)
              : [];
            if (files.some(f => f.startsWith('.github/') || f.startsWith('scripts/package_release.py'))) {
              add('area: automation', 'e4e669', 'Actions, labels and release tooling');
            }
            if (files.some(f => f.endsWith('.md') && !f.startsWith('.github/'))) {
              add('area: docs', 'c5def5', 'Documentation changes');
            }

            // Existing and future mod folders are identified by directory.
            const display = root => root.replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            const roots = new Set();
            const rootResponse = await github.rest.repos.getContent({owner, repo, path:''});
            for (const entry of rootResponse.data) {
              if (entry.type === 'dir' && !['.github','assets','docs','scripts'].includes(entry.name)) {
                roots.add(entry.name);
              }
            }
            for (const file of files) {
              const parts = file.split('/');
              if (parts.length >= 3 && ['bin','r6','archive','red4ext','engine','mods','dlc'].includes(parts[1])) {
                roots.add(parts[0]);
              }
            }
            for (const root of roots) {
              const name = display(root);
              const matches = pr
                ? files.some(f => f.startsWith(root + '/'))
                : title.toLowerCase().includes(name.toLowerCase()) ||
                  title.toLowerCase().includes(root.toLowerCase());
              if (matches) add('mod: ' + name.toLowerCase(), 'bfe5bf', 'For ' + name);
            }

            const existing = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number:number, per_page:100
            });
            const old = new Set(existing.map(l => l.name));
            for (const label of existing) {
              if (/^(type: |area: |mod: )/.test(label.name) && !desired.has(label.name)) {
                await github.rest.issues.removeLabel({owner, repo, issue_number:number, name:label.name});
              }
            }
            for (const [name, properties] of desired) {
              if (old.has(name)) continue;
              try {
                await github.rest.issues.createLabel({owner, repo, name, ...properties});
              } catch (error) {
                if (error.status !== 422) throw error; // already exists
              }
              await github.rest.issues.addLabels({owner, repo, issue_number:number, labels:[name]});
            }
