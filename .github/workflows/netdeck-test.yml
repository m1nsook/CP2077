name: Infiltration native checks

on:
  pull_request:
    paths: ['NetDeck/**', '.github/workflows/netdeck-test.yml', '.github/mod-descriptions.json', '.github/workflows/release.yml']
  push:
    branches: ['feat/nest-cyberdeck']
    paths: ['NetDeck/**', '.github/workflows/netdeck-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test NetDeck and M1 Arc contract
        run: python3 NetDeck/tools/test_netdeck_sources.py
      - name: Build standalone ZIP (no CET)
        run: python3 NetDeck/tools/pack_test.py --output dist/NetDeck-v1.0.0-rc1.zip
      - name: Verify production release packager
        run: |
          python3 scripts/package_release.py --mod NetDeck --tag 1.0.0-dev.1 --output release-test
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          name=next(Path('release-test').glob('*.zip'))
          with ZipFile(name) as z: files=set(z.namelist())
          assert any(n.endswith('NetDeckM1Arc.reds') for n in files)
          assert any(n.endswith('settings.json') for n in files)
          assert not any(n.startswith('bin/') for n in files),files
          print('PASS: production ZIP is CET-free')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Infiltration-M1Arc-v1.0.0-rc1
          path: |
            dist/NetDeck-v1.0.0-rc1.zip
            dist/NetDeck-TEST-SHA256SUMS.txt
          if-no-files-found: error
  redscript:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned M1 Arc declarations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.ci/m1arc-api' -Force | Out-Null
          $commit = '94b2484c54813fb2f1ed9be4d333c6e26fea1dc4'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/m1nsook/m1arc/$commit/r6/scripts/m1arc/M1Arc.reds" -OutFile '.ci/m1arc-api/M1Arc.reds'
      - name: REDscript CLI parser (optional semantic compilation with private game bundle)
        shell: pwsh
        env:
          REDSCRIPT_GAME_BUNDLE_URL: ${{ secrets.REDSCRIPT_GAME_BUNDLE_URL }}
          REDSCRIPT_GAME_BUNDLE_SHA256: ${{ secrets.REDSCRIPT_GAME_BUNDLE_SHA256 }}
        run: |
          ./Daemon/tools/check_redscript_cli.ps1 -SourceRoots @('NetDeck/r6/scripts', '.ci/m1arc-api')
          if ($LASTEXITCODE -ne 0) { throw 'REDscript validation failed' }
