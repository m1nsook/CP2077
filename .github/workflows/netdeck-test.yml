name: Infiltration — NetWatch Σ MK.1 test package

# Source-only game-root ZIP. NO .inkatlas, .xbm, PNG, or private WolvenKit files.
# Does not compile REDscript or publish a GitHub release.
on:
  pull_request:
    paths:
      - 'NetDeck/**'
      - '.github/workflows/netdeck-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Validate source invariants
        run: python3 NetDeck/tools/test_netdeck_sources.py
      - name: Build game-root test ZIP
        run: python3 NetDeck/tools/pack_test.py --output dist/NetDeck-v0.6.1-TEST.zip
      - name: Upload test ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NetDeck-v0.6.1-TEST
          path: |
            dist/NetDeck-v0.6.1-TEST.zip
            dist/NetDeck-TEST-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
