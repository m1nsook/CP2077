name: m1core native CI

on:
  push:
    branches:
      - dev/m1core
    paths:
      - 'm1core/**'
      - '.github/workflows/m1core.yml'
  pull_request:
    paths:
      - 'm1core/**'
      - '.github/workflows/m1core.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR and branch pushes otherwise build the identical commit twice.
# Use the same key for both events and keep only the newest validation run.
concurrency:
  group: m1core-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build Windows x64 plugin and settings tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S m1core -B m1core/build -A x64 -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build m1core/build --config Release --parallel 4
      - name: Run registry tests
        run: ctest --test-dir m1core/build -C Release --output-on-failure
      # GitHub Actions artifacts are ZIPs already. Upload the two game-root
      # directories directly, NOT an archive-inside-an-archive.
      - name: Stage game-ready development build
        shell: pwsh
        run: |
          $root = "m1core/game-package"
          New-Item -ItemType Directory -Force -Path "$root/red4ext/plugins/m1core" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/r6/scripts/m1core" | Out-Null
          Copy-Item "m1core/build/Release/m1core.dll" "$root/red4ext/plugins/m1core/m1core.dll"
          Copy-Item "m1core/r6/scripts/m1core/m1core.reds" "$root/r6/scripts/m1core/m1core.reds"

          # This is a development artifact: the optional test helper only runs
          # when explicitly called from a console and changes no game state.
          Copy-Item "m1core/tests/ingame/m1core_smoke.reds" "$root/r6/scripts/m1core/m1core_smoke.reds"

          # Enable the known-working F11 overlay in this dev/test artifact.
          # For a headless installation, simply delete overlay.enable.
          Set-Content -Path "$root/red4ext/plugins/m1core/overlay.enable" -Value "development overlay enabled"

          $required = @(
            "$root/red4ext/plugins/m1core/m1core.dll",
            "$root/red4ext/plugins/m1core/overlay.enable",
            "$root/r6/scripts/m1core/m1core.reds",
            "$root/r6/scripts/m1core/m1core_smoke.reds"
          )
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing required package file: $file"
            }
          }
          if (Get-ChildItem -Path $root -Filter "*.zip" -Recurse) {
            throw "Nested ZIP found in game package"
          }

      - name: Upload ONE game-ready ZIP (no nested archives)
        uses: actions/upload-artifact@v4
        with:
          name: m1core-game-ready-x64-dev
          path: m1core/game-package/
          if-no-files-found: error
          retention-days: 7

      # Verify the actual downloaded artifact, not just staging directory.
      - name: Download package for layout verification
        uses: actions/download-artifact@v4
        with:
          name: m1core-game-ready-x64-dev
          path: m1core/verify-extract

      - name: Verify ZIP has r6 and red4ext at its root
        shell: pwsh
        run: |
          $root = "m1core/verify-extract"
          $top = @(Get-ChildItem -LiteralPath $root -Directory | ForEach-Object { $_.Name } | Sort-Object)
          if (($top -join ",") -ne "r6,red4ext") {
            throw "Expected only r6/ and red4ext/ at ZIP root; found: $($top -join ', ')"
          }
          foreach ($file in @(
            "r6/scripts/m1core/m1core.reds",
            "r6/scripts/m1core/m1core_smoke.reds",
            "red4ext/plugins/m1core/m1core.dll",
            "red4ext/plugins/m1core/overlay.enable"
          )) {
            if (!(Test-Path -LiteralPath (Join-Path $root $file) -PathType Leaf)) {
              throw "ZIP missing: $file"
            }
          }
          if (Get-ChildItem -LiteralPath $root -Recurse -Filter "*.zip") {
            throw "Nested ZIP found in downloaded artifact"
          }
