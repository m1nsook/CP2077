name: m1core CET Lua CI

on:
  push:
    branches:
      - dev/m1core
    paths:
      - "m1core/**"
      - ".github/workflows/m1core.yml"
  pull_request:
    paths:
      - "m1core/**"
      - ".github/workflows/m1core.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: m1core-cet-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify CET Lua source, tests and game-ready ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4

      - name: Parse every Lua source and test
        shell: bash
        run: |
          set -euo pipefail
          find m1core/src m1core/tests -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Run registry, profile and persistence tests
        run: lua5.4 m1core/tests/test_core.lua

      - name: Test CET ImGui call structure and return order
        run: lua5.4 m1core/tests/test_ui.lua

      - name: Stage one CET game-ready mod
        shell: bash
        run: |
          set -euo pipefail
          target=m1core/game-package/bin/x64/plugins/cyber_engine_tweaks/mods/m1core
          mkdir -p "$target"
          cp m1core/src/{init,core,storage,ui}.lua "$target/"
          cp m1core/LICENSE "$target/LICENSE"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("m1core/game-package")
          assert {p.name for p in root.iterdir()} == {"bin"}
          files = root/"bin/x64/plugins/cyber_engine_tweaks/mods/m1core"
          assert {p.name for p in files.iterdir()} == {
              "init.lua", "core.lua", "storage.lua", "ui.lua", "LICENSE"
          }
          assert all(p.stat().st_size > 0 for p in files.iterdir())
          assert not list(root.rglob("*.zip"))
          print("Verified CET package: bin/ at archive root, no nested ZIP")
          PY

      - name: Upload ONE game-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: m1core-cet-game-ready
          path: m1core/game-package/
          if-no-files-found: error
          retention-days: 7

      - name: Download the same artifact and verify its root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p m1core/artifact-check
          downloaded=0
          for attempt in 1 2 3 4 5 6; do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
               --name m1core-cet-game-ready --dir m1core/artifact-check; then
              downloaded=1
              break
            fi
            sleep 5
          done
          test "$downloaded" -eq 1
          test -f m1core/artifact-check/bin/x64/plugins/cyber_engine_tweaks/mods/m1core/init.lua
          test "$(find m1core/artifact-check -mindepth 1 -maxdepth 1 -printf '%f\n')" = "bin"
