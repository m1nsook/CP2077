name: Action Blocked Fix - development checks
on:
  pull_request:
    paths:
      - 'Action_Blocked_Fix/**'
      - '.github/workflows/action-blocked-fix-check.yml'
      - 'Daemon/tools/check_redscript_cli.ps1'
      - 'scripts/package_release.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redscript:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: REDscript CLI parse and optional semantic compilation
        shell: pwsh
        env:
          REDSCRIPT_GAME_BUNDLE_URL: ${{ secrets.REDSCRIPT_GAME_BUNDLE_URL }}
          REDSCRIPT_GAME_BUNDLE_SHA256: ${{ secrets.REDSCRIPT_GAME_BUNDLE_SHA256 }}
        run: |
          ./Daemon/tools/check_redscript_cli.ps1 -SourceRoots @("Action_Blocked_Fix/r6/scripts")
          if ($LASTEXITCODE -ne 0) { throw "REDscript checks failed" }
  package:
    needs: redscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone development ZIP
        run: |
          python3 scripts/package_release.py --mod Action_Blocked_Fix --tag 0.1.0-dev.2 --output dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path("dist").glob("*.zip"))) as z:
              expected = "r6/scripts/ActionBlockedFix/ActionBlockedFix.reds"
              assert set(z.namelist()) == {expected}, z.namelist()
              assert b"M1Arc_" not in z.read(expected)
              z.extractall("game-root")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: action-blocked-fix-game-root-dev
          path: game-root/
          if-no-files-found: error
