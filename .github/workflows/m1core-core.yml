name: m1core — native RED4ext core

on:
  push:
    branches:
      - dev/m1core-cet-foundation
    paths:
      - "m1core/core/**"
      - "m1core/native/ImGuiCustomTheme.h"
      - "m1core/native/registry.*"
      - "m1core/native/state.*"
      - "m1core/tests/**"
      - ".github/workflows/m1core-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1core-cet-foundation
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 55
    name: Compile m1core native runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install RED4ext SDK pinned to native framework
        uses: actions/checkout@v4
        with:
          repository: wopss/RED4ext.SDK
          ref: a34f0ad0a9e4f37cbe1fe001e4ff68c2949d0665
          path: m1core/core/vendor/RED4ext.SDK
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - name: Cache xmake Windows dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake/packages
            ~/AppData/Local/.xmake/cache
          key: m1core-xmake-windows-x64-v1-${{ hashFiles('m1core/core/xmake.lua') }}
          restore-keys: |
            m1core-xmake-windows-x64-
      - name: Inspect native core target and enforce license/asset restrictions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'm1core/core'
          foreach ($file in @('src/red4ext_plugin.cpp','src/d3d12/D3D12_Hooks.cpp',
                               'src/window/window.cpp','src/VKBindings.cpp',
                               'src/overlay/Overlay.cpp','LICENSE-MIT',
                               'ThirdParty_LICENSES','xmake.lua')) {
            if (!(Test-Path -LiteralPath (Join-Path $root $file))) {
              throw "CET foundation source missing: $file"
            }
          }
          if (Test-Path -LiteralPath "$root/src/common/FontMaterialDesignIcons.h") {
            throw "Restricted CET icon header was committed"
          }
          if (Test-Path -LiteralPath "$root/vendor/asiloader/version.dll") {
            throw "Restricted CET ASI loader was committed"
          }
          $build = Get-Content "$root/xmake.lua" -Raw
          if ($build -notmatch 'target\("m1core"\)') {
            throw "m1core must compile as a RED4ext DLL"
          }
          if (Test-Path -LiteralPath "$root/src/dllmain.cpp") {
            throw "Legacy ASI loader must not be included in the m1core source"
          }
          $gui = Get-Content "$root/src/m1core_registry_ui.cpp" -Raw
          if ($gui -match 'M1CoreRuntime installation|Cyber Engine Tweaks') {
            throw "User-facing m1core UI must not contain legacy CET branding"
          }
          # Regression guard: native game functions outside the override
          # registry MUST pass through to the original script interpreter.
          # Aborting them caused repeated "hooked but isn't" console errors.
          $script = Get-Content "$root/src/scripting/FunctionOverride.cpp" -Raw
          $native = ($script -split 'bool FunctionOverride::HookRunPureScriptFunction', 2)[1]
          $native = ($native -split 'void FunctionOverride::HandleOverridenFunction', 2)[0]
          if (!$native -or $native -notmatch 'lock\.unlock\(\);\s*return RealRunPureScriptFunction\(apFunction, apStack, a3\);') {
            throw "Unregistered native game functions must execute original script interpreter"
          }
          if ($native -match 'Function appears to be hooked but isn.t\?"\);\s*return false;') {
            throw "Never abort unregistered game native functions"
          }
          $entry = Get-Content "$root/src/red4ext_plugin.cpp" -Raw
          if ($entry -match 'GetPaths\(\)\.CETRoot\(') {
            throw "RED4ext entry point must use renamed CoreRoot() accessor"
          }
          if (!(Test-Path "$root/vendor/RED4ext.SDK/include/RED4ext/RED4ext.hpp")) {
            throw "Pinned RED4ext SDK checkout failed"
          }
          # Popup positioning must be opt-in, so external notification
          # users preserve the default bottom-right corner.
          $toasts = Get-Content "$root/src/common/ImGuiNotify.h" -Raw
          $overlay = Get-Content "$root/src/overlay/Overlay.cpp" -Raw
          if ($toasts -notmatch 'position = ImNotifyToastPos::BottomRight' -or
              $toasts -notmatch 'bottomLeftHeight' -or
              $overlay -notmatch 'startup.setPosition\(ImNotifyToastPos::BottomLeft\)' -or
              $overlay -notmatch 'startup.setIcon\(M1CORE_ICON_ABOUT\)') {
            throw "m1core startup toast must be bottom-left and others must remain bottom-right"
          }
      - name: Configure m1core native dependencies
        working-directory: m1core/core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          xmake f -p windows -a x64 -m release -y -vD
          if ($LASTEXITCODE -ne 0) { throw "CET-derived xmake configuration failed" }
      - name: Compile m1core.dll from CET source
        working-directory: m1core/core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          xmake build -y -vD m1core
          if ($LASTEXITCODE -ne 0) { throw "CET-derived DLL compilation failed" }
      - name: Test native registry, persistence, and profiles
        working-directory: m1core/core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          xmake build -y -vD m1core_registry_tests
          if ($LASTEXITCODE -ne 0) { throw "Native registry tests did not compile" }
          xmake run -y m1core_registry_tests
          if ($LASTEXITCODE -ne 0) { throw "Native registry tests failed" }
          xmake build -y -vD m1core_state_tests
          if ($LASTEXITCODE -ne 0) { throw "Native persistence tests did not compile" }
          xmake run -y m1core_state_tests
          if ($LASTEXITCODE -ne 0) { throw "Native persistence tests failed" }
          xmake build -y -vD m1core_script_formats_tests
          if ($LASTEXITCODE -ne 0) { throw "Script extension tests did not compile" }
          xmake run -y m1core_script_formats_tests
          if ($LASTEXITCODE -ne 0) { throw "Script extension tests failed" }
          xmake build -y -vD m1core_script_runtime_tests
          if ($LASTEXITCODE -ne 0) { throw "LuaJIT integration tests did not compile" }
          $fixture = (Resolve-Path -LiteralPath '../examples/lua-smoke').Path
          Write-Host "LuaJIT test fixture: $fixture"
          xmake run -y m1core_script_runtime_tests "$fixture"
          if ($LASTEXITCODE -ne 0) { throw "LuaJIT integration tests failed" }
      - name: Test real m1core Lua registry consumer and compile weight limit bytecode
        working-directory: m1core/core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          xmake build -y -vD m1core_weight_limit_tests
          if ($LASTEXITCODE -ne 0) { throw "Weight limit test executable failed to compile" }
          $source = (Resolve-Path -LiteralPath '../examples/weight-limit/init.m1s').Path
          $compiled = Join-Path (Get-Location) 'weight-limit-build/init.m1c'
          New-Item -ItemType Directory -Path (Split-Path $compiled) -Force | Out-Null
          xmake run -y m1core_weight_limit_tests "$source" "$compiled"
          if ($LASTEXITCODE -ne 0) { throw "Source and compiled weight limit / registry bridge tests failed" }
      - name: Download only licensed Karla, JetBrains Mono and Phosphor fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'm1core/core/font-assets'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          # Immutable upstream commits, not CDN latest; each font's license
          # accompanies the file. No original CET font/icon assets included.
          $assets = @(
            @{ Name='Karla-Regular.ttf'; Uri='https://raw.githubusercontent.com/googlefonts/karla/69b25f663101efb4113dd7ed416c120dd2dce56a/fonts/ttf/Karla-Regular.ttf' },
            @{ Name='JetBrainsMono-Regular.ttf'; Uri='https://raw.githubusercontent.com/JetBrains/JetBrainsMono/19371302b95d218af43299bce79ddbddd0bc364d/fonts/ttf/JetBrainsMono-Regular.ttf' },
            @{ Name='Phosphor-Regular.ttf'; Uri='https://raw.githubusercontent.com/phosphor-icons/web/3d40a3eaa73b25d20d263f0e1e55c9fed3e66809/src/regular/Phosphor.ttf' },
            @{ Name='OFL-KARLA.txt'; Uri='https://raw.githubusercontent.com/googlefonts/karla/69b25f663101efb4113dd7ed416c120dd2dce56a/OFL.txt' },
            @{ Name='OFL-JETBRAINS-MONO.txt'; Uri='https://raw.githubusercontent.com/JetBrains/JetBrainsMono/19371302b95d218af43299bce79ddbddd0bc364d/OFL.txt' },
            @{ Name='LICENSE-PHOSPHOR-MIT.txt'; Uri='https://raw.githubusercontent.com/phosphor-icons/web/3d40a3eaa73b25d20d263f0e1e55c9fed3e66809/LICENSE' }
          )
          foreach ($asset in $assets) {
            Invoke-WebRequest -Uri $asset.Uri -OutFile "$dest/$($asset.Name)"
            if ((Get-Item "$dest/$($asset.Name)").Length -lt 1000) {
              throw "Unexpected missing/truncated licensed font asset: $($asset.Name)"
            }
          }
          foreach ($name in @('Karla-Regular.ttf','JetBrainsMono-Regular.ttf','Phosphor-Regular.ttf')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path "$dest/$name").Path)
            $signature = [BitConverter]::ToString($bytes, 0, 4)
            if ($signature -notin @('00-01-00-00', '4F-54-54-4F')) {
              throw "Invalid TrueType/OpenType signature for $name"
            }
            Get-FileHash "$dest/$name" -Algorithm SHA256 | Format-List
          }
          if (!(Select-String -Path "$dest/OFL-KARLA.txt" -Pattern 'SIL OPEN FONT LICENSE' -Quiet) -or
              !(Select-String -Path "$dest/OFL-JETBRAINS-MONO.txt" -Pattern 'SIL OPEN FONT LICENSE' -Quiet) -or
              !(Select-String -Path "$dest/LICENSE-PHOSPHOR-MIT.txt" -Pattern 'MIT License' -Quiet)) {
            throw 'Third-party font license files are missing or incorrect'
          }
      - name: Package one game-root artifact — exclude CET icons/fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @(Get-ChildItem -LiteralPath 'm1core/core/build' -Filter 'm1core.dll' -Recurse -File)
          if ($source.Count -ne 1) { throw "Expected exactly one CET-derived m1core.dll, got $($source.Count)" }
          $dir = 'm1core/core/game-package/red4ext/plugins/m1core'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item -LiteralPath $source[0].FullName -Destination "$dir/m1core.dll"
          Copy-Item -LiteralPath 'm1core/LICENSE' -Destination "$dir/LICENSE"
          Copy-Item -LiteralPath 'm1core/core/LICENSE-MIT' -Destination "$dir/LICENSE-YAMASHI-MIT"
          Copy-Item -LiteralPath 'm1core/core/ThirdParty_LICENSES' -Destination "$dir/THIRD_PARTY_LICENSES"
          $fontDir = "$dir/fonts"
          New-Item -ItemType Directory -Path $fontDir -Force | Out-Null
          Copy-Item -Path 'm1core/core/font-assets/*' -Destination $fontDir
          $files = @(Get-ChildItem -LiteralPath 'm1core/core/game-package' -File -Recurse)
          if ($files.Count -ne 10) { throw "Unexpected game package file count: $($files.Count)" }
          $allowedFonts = @('JetBrainsMono-Regular.ttf','Karla-Regular.ttf','Phosphor-Regular.ttf')
          $actualFonts = @((Get-ChildItem -LiteralPath $fontDir -File -Filter '*.ttf').Name)
          if (@(Compare-Object -ReferenceObject $allowedFonts -DifferenceObject $actualFonts).Count -ne 0) {
            throw 'Game artifact contains an unexpected font'
          }
          if ($files | Where-Object { $_.Extension -match '(?i)^\.(otf|woff|woff2|png|svg|ico|asi|lua)$' }) {
            throw "Unauthorized CET icon, loader or script entered the package"
          }
          if ($source[0].Length -lt 4096) { throw "Compiled CET-derived DLL unexpectedly small" }
          Get-FileHash -LiteralPath "$dir/m1core.dll" -Algorithm SHA256 | Format-List
          Write-Host 'This is a native compile artifact, NOT proof of game runtime compatibility'
      - name: Package two standalone weight limit sample variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'm1core/examples/weight-limit/init.m1s'
          $compiled = 'm1core/core/weight-limit-build/init.m1c'
          if (!(Test-Path $src) -or !(Test-Path $compiled)) { throw "Missing sample source or real compiled bytecode" }
          $raw = [System.IO.File]::ReadAllBytes((Resolve-Path $compiled).Path)
          if ($raw.Length -lt 4 -or $raw[0] -ne 27 -or $raw[1] -ne 76 -or $raw[2] -ne 74) {
            throw "init.m1c must contain authentic LuaJIT bytecode"
          }
          $sourceDir = 'm1core/core/sample-source/red4ext/plugins/m1core/mods/weight-limit-sample'
          $byteDir = 'm1core/core/sample-bytecode/red4ext/plugins/m1core/mods/weight-limit-sample'
          New-Item -ItemType Directory -Path $sourceDir,$byteDir -Force | Out-Null
          Copy-Item -LiteralPath $src -Destination "$sourceDir/init.m1s"
          Copy-Item -LiteralPath $compiled -Destination "$byteDir/init.m1c"
          Copy-Item -LiteralPath 'm1core/LICENSE' -Destination "$sourceDir/LICENSE"
          Copy-Item -LiteralPath 'm1core/LICENSE' -Destination "$byteDir/LICENSE"
          if ((@(Get-ChildItem 'm1core/core/sample-source' -Recurse -File)).Count -ne 2 -or
              (@(Get-ChildItem 'm1core/core/sample-bytecode' -Recurse -File)).Count -ne 2) {
            throw "Each game-root variant needs exactly the entrypoint and MIT license"
          }
          Get-FileHash "$sourceDir/init.m1s" -Algorithm SHA256 | Format-List
          Get-FileHash "$byteDir/init.m1c" -Algorithm SHA256 | Format-List
      - name: Upload weight limit .m1s source variant
        uses: actions/upload-artifact@v4
        with:
          name: m1core-weight-limit-source
          path: m1core/core/sample-source/
          if-no-files-found: error
          retention-days: 14
      - name: Upload weight limit .m1c bytecode variant
        uses: actions/upload-artifact@v4
        with:
          name: m1core-weight-limit-bytecode
          path: m1core/core/sample-bytecode/
          if-no-files-found: error
          retention-days: 14
      - name: Upload single game-root package
        uses: actions/upload-artifact@v4
        with:
          name: m1core-native-x64-dev
          path: m1core/core/game-package/
          if-no-files-found: error
          retention-days: 14
