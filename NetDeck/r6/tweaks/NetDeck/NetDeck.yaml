# Infiltration — NΣT iconic cyberdeck, TweakXL game-root test build
# Keep Items.NESTCyberdeck stable for existing saves.


Items.NESTCyberdeck:
  $base: Items.AdvancedNetwatchNetdriverMKLegendaryPlusPlus
  friendlyName: NΣT
  displayName: l"NetDeckDeckName"
  localizedDescription: l"NetDeckDeckDescription"
  quality: Quality.LegendaryPlusPlus
  blueprint: Items.CyberdeckBlueprint4Slots
  variants:
    - Variants.Humanity5Cost
  nextUpgradeItem: ''
  OnLooted: []
  OnEquip:
    - Items.BaseDeck_inline0
    - Items.BaseDeck_inline3
    - NetDeck.RAM15Buffer4
    - Items.HackDecreasedAwarenessGainAbility
    - Items.DecreasedHacksCostOnDevicesAbility
    - Items.IncreaseDamageDealtWhileControllingDeviceAbilityLegendaryPlusPlus
  objectActions:
    - !append-once DeviceAction.NetDeckInfiltration
  tags:
    - !remove Iconic_Netdriver_Cyberdeck
    - !append-once NetDeck_Cyberdeck

NetDeck.RAM15Buffer4:
  $type: gamedataGameplayLogicPackage_Record
  stats:
    - $type: gamedataConstantStatModifier_Record
      statType: BaseStats.Memory
      modifierType: Additive
      value: 15
    - $type: gamedataConstantStatModifier_Record
      statType: BaseStats.BufferSize
      modifierType: Additive
      value: 4

# Separate native device quickhack action. Never derive from PingDevice:
# doing so duplicated Ping UI semantics and broke normal Ping selection.
DeviceAction.NetDeckInfiltration:
  $base: DeviceAction.ToggleStateClassHack
  actionName: NetDeckInfiltration
  objectActionUI: Interactions.NetDeckInfiltration
  isQuickHack: true
  objectActionType: ObjectActionType.DeviceQuickHack
  startEffects: []
  completionEffects: []
  targetPrereqs: []
  targetActivePrereqs: []

Interactions.NetDeckInfiltration:
  $base: Interactions.TakeControlCameraHack
  caption: l"NetDeckInfiltrationName"
  description: l"NetDeckInfiltrationDescription"

# One guaranteed stock record, appended to all known Night City / Dogtown
# ripperdoc lists. This does not replace any existing stock.
NetDeck.RipperdocStock:
  $type: gamedataVendorItem_Record
  item: Items.NESTCyberdeck
  quantity:
    - Vendors.Always_Present

Vendors.AdvancedCollectiveRipperDoc.itemStock: &NetDeckVendor
