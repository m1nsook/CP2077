# UndiscoverMe is a FIFTH top-level world-map quick filter.
# Original cycle: Dynamic -> Jobs -> Service Point -> Custom -> UndiscoverMe.
# Do NOT append anything to WorldMap.WorldMapCustomFiltersList.
#
# CustomFilter is the engine's supported shared variant-based map mode.
# REDscript distinguishes this quick-filter RECORD from vanilla Custom,
# temporarily applies UndiscoverMe-only category selections and restores
# the player's original Custom mask when leaving the tab / closing the map.
WorldMap.UndiscoverMeQuickFilter:
  $type: gamedataMappinUIFilterGroup_Record
  filterName: UndiscoverMe
  filterType: WorldMap.CustomFilter
  mappins: []
  shouldCollectMappins: false

WorldMap.WorldMapQuickFiltersList.list:
  - !append-once WorldMap.UndiscoverMeQuickFilter
